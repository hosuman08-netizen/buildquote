<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiteForge — 인테리어 견적서 · 공정표 · 현장 관리</title>
  <meta name="description" content="평형과 시공 범위만 고르면 공정별 라인아이템 견적서·공정표·결제 스케줄이 한 번에. 국내 인테리어 실무 문법 그대로 만든 가상 견적 시뮬레이터.">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hosuman08-netizen.github.io/buildquote/">
  <meta property="og:title" content="SiteForge — 인테리어 견적서 · 공정표 · 현장 관리">
  <meta property="og:description" content="공정별 라인아이템 견적서, 공정표, 계약금·중도금·잔금 스케줄까지. 국내 실무 문법 그대로의 가상 견적 시뮬레이터.">
  <meta property="og:image" content="https://hosuman08-netizen.github.io/buildquote/og.png">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:site_name" content="SiteForge">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SiteForge — 인테리어 견적서 · 공정표 · 현장 관리">
  <meta name="twitter:description" content="공정별 라인아이템 견적서, 공정표, 결제 스케줄까지 한 번에.">
  <meta name="twitter:image" content="https://hosuman08-netizen.github.io/buildquote/og.png">

  <link rel="canonical" href="https://hosuman08-netizen.github.io/buildquote/">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- 고지: 표시와 코드가 일치. 금액은 공개 시세 범위를 참고한 예시 단가이며 실제 계약 효력 없음. -->
  <div class="banner" role="note">
    <b>가상 시뮬레이션</b> · 실제 계약 · 시공 · 자금 이동이 아닙니다. 단가는 공개 시세 범위를 참고한 <b>예시값</b>이며 실제 견적을 대체하지 않습니다. 18+
  </div>

  <div class="container">
    <header class="topbar">
      <div class="brand">
        <h1>SiteForge</h1>
        <p class="tagline">인테리어 견적서 · 공정표 · 현장 관리</p>
      </div>
      <button id="cv-toggle" class="viewtoggle" onclick="toggleClientView()" title="건축주에게 보여줄 화면으로 전환 (원가·이윤 숨김)">시공사 뷰</button>
    </header>

    <nav class="nav" aria-label="주요 화면">
      <button data-section="dashboard" onclick="showDashboard()">대시보드</button>
      <button data-section="estimate"  onclick="showEstimate()">견적</button>
      <button data-section="docs"      onclick="goDoc(docSource,'quote')">문서</button>
      <button data-section="projects"  onclick="showProjects()">프로젝트</button>
      <button data-section="site"      onclick="showSite()">현장</button>
      <button data-section="pricebook" onclick="showPricebook()">단가표</button>
      <button data-section="materials" onclick="showTrade()">자재</button>
    </nav>

    <main>
      <section id="dashboard" class="section">
        <h2>대시보드</h2>
        <div id="dash-body"></div>
      </section>

      <section id="estimate" class="section hidden">
        <h2>견적 작성 <small>공정별 라인아이템</small></h2>
        <div id="estimate-body"></div>
      </section>

      <section id="docs" class="section hidden">
        <h2>문서 <small>견적서 · 공정표 · 계약서 · 결제</small></h2>
        <div id="docs-body"></div>
      </section>

      <section id="projects" class="section hidden">
        <h2>프로젝트</h2>
        <div id="project-list"></div>
      </section>

      <section id="detail" class="section hidden">
        <h2 class="sr-only">현장 상세</h2>
        <div id="detail-body"></div>
      </section>

      <section id="site" class="section hidden">
        <h2>현장 <small>작업일지 · 사진 · 하자</small></h2>
        <div id="site-body"></div>
      </section>

      <section id="pricebook" class="section hidden">
        <h2>단가표 <small>마이 단가 · 품목 관리</small></h2>
        <div id="pricebook-body"></div>
      </section>

      <section id="materials" class="section hidden">
        <h2>자재 명세</h2>
        <div id="materials-body"></div>
      </section>
    </main>

    <footer class="site-footer">
      <a href="https://hosuman08-netizen.github.io/legion-hub/">다른 앱 더보기</a>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./lung-surprise-eye.js"></script>
  <script src="script.js"></script>
<script>window.LEGION_APP='buildquote';window.LEGION_ANALYTICS_URL='https://legion-analytics.hoyashi95.workers.dev';</script>
<script src="legion-beacon.js"></script>
</body>
</html>
