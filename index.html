<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiteForge • 건설 견적·관리</title>
  <meta name="description" content="건설 프로젝트 견적·진행 관리 시뮬레이터. 비용 견적, 현장 음성 로그, 자재 거래. 가상 시뮬레이션(실제 자금·시공 아님).">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="container">
    <header>
      <div class="disclaimer">FICTIONAL CONSTRUCTION SIMULATION • 18+ • 가상 시뮬레이션일 뿐이며 실제 투자·자금 이동·실제 시공이 아닙니다. 모든 화폐는 가상 크레딧입니다.</div>
      <h1>SiteForge</h1>
      <p class="tagline">건설 견적 · 현장 로그 · 자재 관리 (시뮬레이션)</p>

      <div class="wallet">
        <button onclick="connectWallet()">지갑 연결</button>
        <div id="wallet-info">게스트 • 680 크레딧</div>
      </div>

      <div class="nav">
        <button data-section="dashboard" onclick="showDashboard()">대시보드</button>
        <button data-section="projects" onclick="showProjects()">프로젝트</button>
        <button data-section="estimate" onclick="showEstimate()">견적</button>
        <button data-section="voice" onclick="showVoice()">현장 로그</button>
        <button data-section="trade" onclick="showTrade()">자재</button>
        <button data-section="codex" onclick="showCodex()">노트</button>
        <button data-section="preview" onclick="showPreview()">미리보기</button>
      </div>
    </header>

    <!-- Dashboard -->
    <div id="dashboard" class="section">
      <h2>진행 중 현장</h2>
      <div id="map"></div>
      <div id="active-builds" class="grid"></div>
    </div>

    <!-- Projects / Bids -->
    <div id="projects" class="section hidden">
      <h2>프로젝트</h2>
      <div id="project-list" class="grid"></div>
      <button onclick="showEstimate()" class="primary">+ 새 견적 / 프로젝트</button>
    </div>

    <!-- Estimate Builder (real construction estimating) -->
    <div id="estimate" class="section hidden">
      <h2>비용 견적 작성</h2>
      <div id="estimate-body"></div>
    </div>

    <!-- Project Detail: real progress tracking -->
    <div id="project-detail" class="section hidden">
      <h2>프로젝트 진행률</h2>
      <div id="detail-body"></div>
    </div>

    <!-- Voice Log -->
    <div id="voice" class="section hidden">
      <h2>🎙 현장 음성 로그</h2>
      <button onclick="recordVoiceLog()">🎙 일일 로그 녹음</button>
      <div id="voice-preview"></div>
      <div id="log-result"></div>
    </div>

    <!-- Trade / Materials -->
    <div id="trade" class="section hidden">
      <h2>자재 거래 (가상 크레딧)</h2>
      <div id="materials-list" class="grid"></div>
    </div>

    <!-- Notes -->
    <div id="codex" class="section hidden">
      <h2>📓 현장 노트</h2>
      <div id="codex-list"></div>
    </div>

    <!-- Virtual Build Preview -->
    <div id="preview" class="section hidden">
      <h2>🖼 가상 시공 미리보기</h2>
      <div id="preview-viz" style="height:120px;background:#12100d;border:1px solid #3a3124;border-radius:6px;position:relative;overflow:hidden;margin-bottom:8px;">
        <div id="build-preview" style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:60px;background:linear-gradient(#c5a46e,#8b6f47);transition:all 0.4s;height:40px;border-radius:2px;box-shadow:0 0 12px #c5a46e;"></div>
      </div>
      <div id="preview-meta" style="font-size:11px;color:#8b6f47;"></div>
      <button onclick="liveTourPreview()">라이브 투어 (음성)</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./lung-surprise-eye.js"></script>
  <script src="script.js"></script>
</body>
</html>
